name: Publish Audio Path Inspector preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Unique preview tag (for example v0.4.0-preview.1)'
        required: true
        type: string
      confirmed_device_test:
        description: 'Confirm the APK has been installed and its core read-only flows checked on a physical device'
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    if: ${{ inputs.confirmed_device_test }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build preview APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Package APK and checksum
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/AudioPathInspector-preview-debug.apk
          cd release
          sha256sum AudioPathInspector-preview-debug.apk > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        shell: bash
        run: |
          case "$TAG_NAME" in
            v*-preview.*) ;;
            *) echo "Expected preview tag like v0.4.0-preview.1"; exit 1 ;;
          esac
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG_NAME" release/AudioPathInspector-preview-debug.apk release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" --prerelease \
            --title "Audio Path Inspector $TAG_NAME (test APK)" \
            --notes "Read-only Android audio diagnostics developer preview. Debug-signed test APK, not a production-signed release. Shizuku access and root-assisted Tinymix inspection are optional and device-dependent. Review privileged diagnostic reports before sharing. Physical-device testing remains limited; Android framework/vendor metadata does not establish bit-perfect DAC output. SHA-256 is attached."
